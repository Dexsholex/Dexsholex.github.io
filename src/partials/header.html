<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" class="brand-bg"/><g class="brand-fg"><circle cx="16" cy="16" r="7.5" fill="none" stroke-width="2"/><path d="M16 4.5v5.5M16 22v5.5M4.5 16H10M22 16h5.5" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" stroke="none"/></g></svg>
      <span>{{ name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="{{ nav_prefix }}#work">Work</a></li>
        <li><a href="{{ nav_prefix }}#products">Products</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="{{ nav_prefix }}#about">About</a></li>
        <li><a href="{{ nav_prefix }}#contact">Contact</a></li>
      </ul>
    </nav>

      <button class="theme-toggle" type="button" data-theme-toggle hidden>
        <svg class="i-sun" aria-hidden="true" focusable="false"><use href="#i-sun"/></svg>
        <svg class="i-moon" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg>
        <span class="visually-hidden">Switch colour theme</span>
      </button>
      <a class="btn btn-sm" href="{{ call_url }}">Book a call</a>
    </div>
  </div>
</header>
