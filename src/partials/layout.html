<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="author" content="{{ name }}">
<meta name="robots" content="{{ robots }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1613" media="(prefers-color-scheme: dark)">
<meta name="geo.region" content="NG-LA">
<meta name="geo.placename" content="Lagos">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:site_name" content="{{ name }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ og_image_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ og_image }}">
<meta name="twitter:image:alt" content="{{ og_image_alt }}">
{{ verification_meta }}
<script>var d=document.documentElement;try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")d.dataset.theme=t}catch(e){}d.classList.add("js");if(location.hash)d.classList.add("cv-off")</script>
<style>{{ css }}</style>
{{ jsonld }}
</head>
