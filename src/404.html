<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · {{ name }}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ base_url }}favicon.ico" sizes="32x32">
<link rel="icon" href="{{ base_url }}favicon.svg" type="image/svg+xml">
<style>{{ css }}</style>
</head>
<body>
<main class="wrap notfound">
  <p class="eyebrow">Error 404</p>
  <h1>This page isn't on the map.</h1>
  <p>The link may be old or mistyped. Everything on this site is on one page.</p>
  <a class="btn" href="{{ base_url }}">Go to the home page</a>
</main>
</body>
</html>
